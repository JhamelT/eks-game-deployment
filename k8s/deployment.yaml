apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: game-2048
  name: deployment-2048

spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: app-2048

  replicas: 3

  template:
    metadata:
      labels:
        app.kubernetes.io/name: app-2048

    spec:
      containers:
        - name: app-2048
          image: public.ecr.aws/l6m2t8p7/docker-2048:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          # The application container requests 0.25 vCPU and 512 MiB.
          #
          # EKS Fargate adds platform overhead to the pod's memory request
          # before selecting a supported Fargate configuration. Because of
          # that overhead, this workload may provision above the container's
          # declared 512 MiB request.
          #
          # The CapacityProvisioned annotation on a running pod is the final
          # source of truth for the provisioned Fargate size.
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
